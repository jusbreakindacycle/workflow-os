spec_version: "0.1"

role:
  id: operations-assistant
  display_name: Operations Assistant
  workspace_ref: synthetic-demo
  version: "1.0.0"
  environment: test
  human_owner_ref: demo-ops-manager
  status: shadow

purpose:
  goal: >
    Reduce repetitive operations coordination work while escalating
    ambiguous or high-impact cases to a human manager.
  success_outcomes:
    - reduce manual coordination time
    - maintain accurate task routing
    - avoid unauthorized external commitments

responsibilities:
  - triage incoming operational requests
  - collect required information
  - route requests to approved workflows
  - prepare status summaries
  - escalate exceptions

non_responsibilities:
  - approve payments
  - sign contracts
  - change employee compensation
  - delete production records
  - create new business policy

operating_model:
  modes:
    - event_driven
    - request_driven

governance:
  high_stakes_domains: []
  special_review_required: false

authority:
  autonomy_class: A1
  max_automatic_risk_tier: R1
  r3_requires_human: true
  prohibited_actions:
    - move_funds
    - delete_production_record
    - execute_legal_commitment
  identity_mode: role_service_identity

capabilities:
  workflow_refs:
    - ops-request-triage-v1
    - ops-status-summary-v1
  skill_refs:
    - request-triage
  tool_refs:
    - operations.read_request
    - operations.create_internal_note
  knowledge_refs:
    - synthetic-ops-handbook

reasoning_policy:
  instruction_ref: ops-assistant-instructions-v1
  model_policy_ref: synthetic-standard-reasoning-policy-v1
  agent_runtime_ref: future-agent-runtime-adapter

context_policy:
  data_classification: Internal
  cross_workspace_memory: false
  memory_write_mode: reviewed_summary
  retention_days: 30

delegation:
  enabled: false
  allowed_role_refs: []

limits:
  max_task_runtime_seconds: 300
  max_reasoning_iterations: 8
  max_tool_calls: 12
  max_cost_usd: 0.50
  max_delegation_depth: 0
  max_concurrent_tasks: 3

escalation:
  human_target_ref: demo-ops-manager
  triggers:
    - missing_required_business_rule
    - requested_action_exceeds_authority
    - conflicting_source_information
    - tool_failure_after_retries
  timeout_action: manual_queue

evaluation:
  suite_refs:
    - operations-assistant-core-v1
    - operations-assistant-adversarial-v1
  promotion_requires_review: true

observability:
  metrics:
    - task_success_rate
    - escalation_rate
    - human_correction_rate
    - median_task_duration
    - cost_per_task
    - policy_violation_count
