name: Workflow OS Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 24.15
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - name: Verify source and tests
        run: npm run verify
      - name: Verify migration and backup commands
        run: |
          npm run db:migrate
          npm run db:backup
      - name: Certify Phase 3 local delivery golden path
        run: npm run phase3:certify
      - name: Confirm live provider harnesses are opt-in only
        run: |
          if npm run phase2:live >/tmp/phase2-live.out 2>&1; then
            echo "phase2:live unexpectedly ran without explicit operator approval" >&2
            exit 1
          fi
          grep -q "Live execution is disabled" /tmp/phase2-live.out

          if npm run phase21:certify >/tmp/phase21-free.out 2>&1; then
            echo "phase21:certify unexpectedly ran without explicit operator approval" >&2
            exit 1
          fi
          grep -q "Free-First live execution is disabled" /tmp/phase21-free.out
